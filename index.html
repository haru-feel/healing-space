<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 감성 힐링 공간</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            user-select: none;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(18, 20, 32, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        /* 시간대 선택 패널 */
        .time-container {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 14px 18px;
            z-index: 10;
        }
        .panel-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }
        .time-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .time-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            padding: 7px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .time-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .time-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* 사운드 믹서 패널 */
        .sound-container {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 18px;
            width: 230px;
            z-index: 10;
        }
        .sound-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .audio-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }
        .sound-control {
            margin-bottom: 10px;
        }
        .sound-control label {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.85);
        }
        .sound-control input[type=range] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
            outline: none;
        }
        .sound-control input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* 하단 명언 패널 */
        .quote-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            max-width: 580px;
            width: 90%;
            text-align: center;
            z-index: 10;
        }
        .quote-text {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
        }
        .spatial-tag {
            font-size: 10px;
            color: #88ffaa;
            margin-top: 4px;
            display: block;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단: 시간대 변경 -->
    <div class="glass-panel time-container">
        <div class="panel-title">TIME OF DAY</div>
        <div class="time-buttons">
            <button class="time-btn" onclick="setTimeOfDay('dawn')">🌌 새벽</button>
            <button class="time-btn" onclick="setTimeOfDay('morning')">🌅 아침</button>
            <button class="time-btn" onclick="setTimeOfDay('noon')">☀️ 점심</button>
            <button class="time-btn" onclick="setTimeOfDay('sunset')">🌇 저녁</button>
            <button class="time-btn active" onclick="setTimeOfDay('night')">🌙 밤</button>
        </div>
    </div>

    <!-- 우측 상단: 입체 사운드 믹서 -->
    <div class="glass-panel sound-container">
        <div class="sound-header">
            <span class="panel-title" style="margin:0;">3D AUDIO MIXER</span>
            <button class="audio-toggle-btn" id="audio-toggle">🔊</button>
        </div>
        <div class="sound-control">
            <label>🔥 3D 모닥불 (중앙 고정)</label>
            <input type="range" id="vol-fire" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="sound-control">
            <label>🐦 숲속 새소리</label>
            <input type="range" id="vol-bird" min="0" max="1" step="0.01" value="0.3">
        </div>
        <div class="sound-control">
            <label>🌊 파도 소리</label>
            <input type="range" id="vol-wave" min="0" max="1" step="0.01" value="0.15">
        </div>
        <div class="sound-control">
            <label>🌧️ 빗소리</label>
            <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.1">
        </div>
        <div class="sound-control">
            <label>💨 바람소리</label>
            <input type="range" id="vol-wind" min="0" max="1" step="0.01" value="0.2">
        </div>
    </div>

    <!-- 하단 힐링 문구 -->
    <div class="glass-panel quote-container">
        <div class="quote-text" id="quote-display">"화면을 회전하면 모닥불 소리가 방향에 맞춰 입체적으로 이동합니다."</div>
        <span class="spatial-tag">🎧 이어폰이나 헤드폰 착용 시 3D 입체 음향 효과가 극대화됩니다</span>
    </div>

    <!-- Three.js 엔진 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 3D 씬 및 카메라 구성 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 기본 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainSunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainSunLight.position.set(10, 20, 10);
        scene.add(mainSunLight);

        // 모닥불 빛
        const fireLight = new THREE.PointLight(0xffaa33, 2.5, 12);
        fireLight.position.set(0, 0.8, 0);
        scene.add(fireLight);

        // 바닥
        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a140a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3D 모닥불 오브젝트
        const campfireGroup = new THREE.Group();
        const logMat = new THREE.MeshStandardMaterial({ color: 0x2b1704, roughness: 0.8 });
        for (let i = 0; i < 5; i++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.2, 8), logMat);
            log.rotation.z = Math.PI / 3;
            log.rotation.y = (i * Math.PI) / 2.5;
            log.position.y = 0.1;
            campfireGroup.add(log);
        }
        scene.add(campfireGroup);

        // 불꽃 파티클
        const fireParticleCount = 50;
        const fireGeo = new THREE.BufferGeometry();
        const firePos = new Float32Array(fireParticleCount * 3);
        for (let i = 0; i < fireParticleCount * 3; i += 3) {
            firePos[i] = (Math.random() - 0.5) * 0.4;
            firePos[i+1] = Math.random() * 0.8;
            firePos[i+2] = (Math.random() - 0.5) * 0.4;
        }
        fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
        const fireMat = new THREE.PointsMaterial({ color: 0xff6600, size: 0.15, transparent: true, opacity: 0.8 });
        const fireParticles = new THREE.Points(fireGeo, fireMat);
        scene.add(fireParticles);

        // 나무 생성
        const treeGroup = new THREE.Group();
        scene.add(treeGroup);
        const trees = [];
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x0f401b, roughness: 0.8 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a1108 });

        for (let i = 0; i < 40; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 4.5 + Math.random() * 22;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 3.5, 6), trunkMat);
            trunk.position.set(x, 1.75, z);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.5, 6), leavesMat);
            leaves.position.set(x, 4, z);

            treeGroup.add(trunk);
            treeGroup.add(leaves);
            trees.push({ leaves });
        }

        // 대기 파티클
        const particleCount = 200;
        const envGeo = new THREE.BufferGeometry();
        const envPos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            envPos[i] = (Math.random() - 0.5) * 40;
            envPos[i+1] = Math.random() * 10;
            envPos[i+2] = (Math.random() - 0.5) * 40;
        }
        envGeo.setAttribute('position', new THREE.BufferAttribute(envPos, 3));
        const envMat = new THREE.PointsMaterial({ color: 0xaaff88, size: 0.15, transparent: true, opacity: 0.7 });
        const envParticles = new THREE.Points(envGeo, envMat);
        scene.add(envParticles);

        // --- 2. 시간대 설정 (새벽 - 아침 - 점심 - 저녁 - 밤) ---
        const timeConfigs = {
            dawn: {
                fog: 0x1b1c30,
                bg: 0x1b1c30,
                ambient: 0x333b55,
                sunColor: 0xffaa88,
                sunIntensity: 0.6,
                leavesColor: 0x1f3a38,
                particleColor: 0xddaaff
            },
            morning: {
                fog: 0x87ceeb,
                bg: 0x87ceeb,
                ambient: 0x667788,
                sunColor: 0xffffff,
                sunIntensity: 1.2,
                leavesColor: 0x2e6f40,
                particleColor: 0xffffff
            },
            noon: {
                fog: 0xa0e0ff,
                bg: 0xa0e0ff,
                ambient: 0x8899aa,
                sunColor: 0xffffff,
                sunIntensity: 1.6,
                leavesColor: 0x1e8238,
                particleColor: 0xffffff
            },
            sunset: {
                fog: 0x3b1510,
                bg: 0x3b1510,
                ambient: 0x663322,
                sunColor: 0xff6633,
                sunIntensity: 1.4,
                leavesColor: 0x4a2511,
                particleColor: 0xffaa44
            },
            night: {
                fog: 0x050510,
                bg: 0x050510,
                ambient: 0x111122,
                sunColor: 0x4466aa,
                sunIntensity: 0.4,
                leavesColor: 0x0b2414,
                particleColor: 0xaaff88
            }
        };

        function setTimeOfDay(timeKey) {
            const cfg = timeConfigs[timeKey];
            scene.fog = new THREE.FogExp2(cfg.fog, 0.02);
            renderer.setClearColor(cfg.bg);
            ambientLight.color.setHex(cfg.ambient);
            mainSunLight.color.setHex(cfg.sunColor);
            mainSunLight.intensity = cfg.sunIntensity;
            leavesMat.color.setHex(cfg.leavesColor);
            envMat.color.setHex(cfg.particleColor);

            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        }

        setTimeOfDay('night');

        // --- 3. 입체 오디오 엔진 (3D Spatial Audio) ---
        let audioCtx = null;
        let masterGain = null;
        let firePanner = null;
        let fireGain, birdGain, waveGain, rainGain, windGain;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.6;
            masterGain.connect(audioCtx.destination);

            // 노이즈 필터 생성 함수
            function createNoiseFilter(type, freq) {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                src.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = type;
                filter.frequency.value = freq;

                src.connect(filter);
                src.start(0);
                return filter;
            }

            // 1. 3D 공간 입체 모닥불 사운드 (PannerNode 적용)
            firePanner = audioCtx.createPanner();
            firePanner.panningModel = 'HRTF';
            firePanner.distanceModel = 'inverse';
            firePanner.refDistance = 1;
            firePanner.maxDistance = 10000;
            firePanner.rolloffFactor = 1;
            firePanner.setPosition(0, 0, 0); // 3D 공간 상의 모닥불 위치

            fireGain = audioCtx.createGain();
            fireGain.gain.value = parseFloat(document.getElementById('vol-fire').value);
            
            const fireNoise = createNoiseFilter('bandpass', 750);
            fireNoise.connect(fireGain);
            fireGain.connect(firePanner);
            firePanner.connect(masterGain);

            // 2. 새소리
            birdGain = audioCtx.createGain();
            birdGain.gain.value = parseFloat(document.getElementById('vol-bird').value);
            setInterval(() => {
                if (!audioCtx || birdGain.gain.value < 0.01) return;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2200 + Math.random() * 800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(3200 + Math.random() * 400, audioCtx.currentTime + 0.12);
                g.gain.setValueAtTime(0.04, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(g);
                g.connect(birdGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }, 3500);
            birdGain.connect(masterGain);

            // 3. 파도 소리
            waveGain = audioCtx.createGain();
            waveGain.gain.value = parseFloat(document.getElementById('vol-wave').value);
            createNoiseFilter('lowpass', 350).connect(waveGain);
            waveGain.connect(masterGain);

            // 4. 빗소리
            rainGain = audioCtx.createGain();
            rainGain.gain.value = parseFloat(document.getElementById('vol-rain').value);
            createNoiseFilter('lowpass', 1100).connect(rainGain);
            rainGain.connect(masterGain);

            // 5. 바람소리
            windGain = audioCtx.createGain();
            windGain.gain.value = parseFloat(document.getElementById('vol-wind').value);
            createNoiseFilter('bandpass', 220).connect(windGain);
            windGain.connect(masterGain);

            isAudioInitialized = true;
        }

        // 컨트롤러 슬라이더 연동
        document.getElementById('vol-fire').addEventListener('input', e => fireGain && (fireGain.gain.value = e.target.value));
        document.getElementById('vol-bird').addEventListener('input', e => birdGain && (birdGain.gain.value = e.target.value));
        document.getElementById('vol-wave').addEventListener('input', e => waveGain && (waveGain.gain.value = e.target.value));
        document.getElementById('vol-rain').addEventListener('input', e => rainGain && (rainGain.gain.value = e.target.value));
        document.getElementById('vol-wind').addEventListener('input', e => windGain && (windGain.gain.value = e.target.value));

        // 클릭 시 오디오 잠금 해제
        window.addEventListener('click', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        // 토글 버튼
        let isMuted = false;
        document.getElementById('audio-toggle').addEventListener('click', (e) => {
            initAudio();
            isMuted = !isMuted;
            masterGain.gain.value = isMuted ? 0 : 0.6;
            e.target.textContent = isMuted ? '🔇' : '🔊';
        });

        // --- 4. 마우스 카메라 시점 컨트롤 ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;

        window.addEventListener('mousedown', () => { isDragging = true; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                cameraAngle -= deltaX * 0.004;
                camera.position.x = Math.sin(cameraAngle) * 9;
                camera.position.z = Math.cos(cameraAngle) * 9;
                camera.lookAt(0, 1.2, 0);

                // 카메라 회전에 따라 Audio Listener의 위치와 정면 방향 업데이트 (3D 입체음향 핵심)
                if (audioCtx && audioCtx.listener) {
                    const lx = camera.position.x;
                    const lz = camera.position.z;
                    if (audioCtx.listener.setPosition) {
                        audioCtx.listener.setPosition(lx, 2.5, lz);
                        audioCtx.listener.setOrientation(-lx, -0.2, -lz, 0, 1, 0);
                    }
                }
            }
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        // --- 5. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 불빛 깜빡임
            fireLight.intensity = 2.0 + Math.sin(time * 10) * 0.4 + Math.cos(time * 19) * 0.3;

            // 불꽃 파티클
            const fPos = fireGeo.attributes.position.array;
            for (let i = 1; i < fPos.length; i += 3) {
                fPos[i] += 0.008;
                if (fPos[i] > 1.0) fPos[i] = 0;
            }
            fireGeo.attributes.position.needsUpdate = true;

            // 대기 파티클
            const ePos = envGeo.attributes.position.array;
            for (let i = 1; i < ePos.length; i += 3) {
                ePos[i] += Math.sin(time + i) * 0.003;
            }
            envGeo.attributes.position.needsUpdate = true;

            // 나무 움직임
            trees.forEach((tree, idx) => {
                tree.leaves.rotation.z = Math.sin(time * 1.2 + idx) * 0.02;
            });

            camera.lookAt(0, 1.2, 0);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
