<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 입체 힐링 숲 스페이스</title>
    <!-- 유튜브 오디오 API를 위한 IFrame API 로드 -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            user-select: none;
            color: #fff;
            touch-action: none; /* 모바일 브라우저 기본 스크롤 동작 방지 */
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* 백그라운드 유튜브 오디오 숨김 처리 */
        .hidden-yt-player {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(18, 20, 32, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* 우측 상단: 접이식 유튜브 ASMR 믹서 */
        .sound-container {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 14px;
            width: 250px;
            max-width: calc(100vw - 30px);
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sound-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.7);
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 5px 8px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .sound-body {
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
            opacity: 1;
        }
        /* 접힘 클래스 적용 시 */
        .sound-container.collapsed .sound-body {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .sound-control {
            margin-bottom: 9px;
        }
        .sound-control label {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            color: rgba(255, 255, 255, 0.85);
        }
        .sound-control input[type=range] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
            outline: none;
        }
        .sound-control input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* 하단 컨트롤 그룹 (배경 테마 + 명언 위젯) */
        .bottom-group {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        /* 하루명언 위로 이동한 테마 선택 바 (좌우 스크롤 가능) */
        .time-container {
            width: 100%;
            padding: 8px 12px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            touch-action: pan-x; /* 테마 바는 가로 스크롤 허용 */
        }
        .time-container::-webkit-scrollbar {
            display: none;
        }
        .time-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            min-width: max-content;
        }
        .time-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .time-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .time-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* 하단: 힐링 명언 위젯 */
        .quote-container {
            width: 100%;
            padding: 14px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .quote-category {
            font-size: 9px;
            letter-spacing: 1px;
            color: #ffd700;
            text-transform: uppercase;
            font-weight: 600;
        }
        .quote-text {
            font-size: 13px;
            font-weight: 300;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.95);
        }
        .refresh-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
            margin-top: 2px;
        }
        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* 모바일 세로 화면 반응형 미디어쿼리 */
        @media (max-width: 768px) {
            .sound-container {
                top: 10px;
                right: 10px;
                width: 210px;
                padding: 10px 12px;
            }
            .time-buttons {
                justify-content: flex-start;
            }
            .bottom-group {
                bottom: 12px;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 유튜브 오디오 플레이어 임베드 영역 (숨김 처리) -->
    <div class="hidden-yt-player">
        <div id="yt-fire"></div>
        <div id="yt-wave"></div>
        <div id="yt-rain"></div>
        <div id="yt-wind"></div>
        <div id="yt-cricket"></div>
    </div>

    <!-- 우측 상단: 접이식 유튜브 ASMR & 믹서 패널 -->
    <div class="glass-panel sound-container" id="sound-panel">
        <div class="sound-header">
            <span class="panel-title">ASMR MIXER</span>
            <div class="header-actions">
                <button class="icon-btn" id="audio-toggle" title="음소거 토글">🔇</button>
                <button class="icon-btn" id="collapse-toggle" onclick="toggleMixer()" title="패널 접기/펼치기">▲</button>
            </div>
        </div>
        <div class="sound-body">
            <div class="sound-control">
                <label>🔥 모닥불소리 <span id="val-fire">0</span>%</label>
                <input type="range" id="vol-fire" min="0" max="100" value="0">
            </div>
            <div class="sound-control">
                <label>🌊 파도소리 <span id="val-wave">0</span>%</label>
                <input type="range" id="vol-wave" min="0" max="100" value="0">
            </div>
            <div class="sound-control">
                <label>🌧️ 비내리는소리 <span id="val-rain">0</span>%</label>
                <input type="range" id="vol-rain" min="0" max="100" value="0">
            </div>
            <div class="sound-control">
                <label>💨 바람소리 <span id="val-wind">0</span>%</label>
                <input type="range" id="vol-wind" min="0" max="100" value="0">
            </div>
            <div class="sound-control">
                <label>🦗 풀벌레소리 <span id="val-cricket">0</span>%</label>
                <input type="range" id="vol-cricket" min="0" max="100" value="0">
            </div>
        </div>
    </div>

    <!-- 하단 영역: 하루 명언 위쪽으로 이동한 테마 선택 바 + 명언 위젯 -->
    <div class="bottom-group">
        <!-- 배경 테마 선택 바 (가로 스크롤 가능) -->
        <div class="glass-panel time-container">
            <div class="time-buttons">
                <button class="time-btn" onclick="setTimeOfDay('dawn')">🌌 새벽</button>
                <button class="time-btn" onclick="setTimeOfDay('morning')">🌅 아침</button>
                <button class="time-btn" onclick="setTimeOfDay('noon')">☀️ 점심</button>
                <button class="time-btn" onclick="setTimeOfDay('sunset')">🌇 저녁</button>
                <button class="time-btn active" onclick="setTimeOfDay('night')">🌙 밤</button>
            </div>
        </div>

        <!-- 힐링 명언 위젯 -->
        <div class="glass-panel quote-container">
            <div class="quote-category" id="q-category">✨ 오늘의 위로</div>
            <div class="quote-text" id="q-text">"마음의 속도를 줄이고, 지금 이 순간 스쳐 지나가는 온기에 집중해보세요."</div>
            <button class="refresh-btn" onclick="getRandomQuote()">🔄 다른 문장 보기</button>
        </div>
    </div>

    <!-- Three.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 0. 믹서 패널 접기/펼치기 토글 함수 ---
        function toggleMixer() {
            const panel = document.getElementById('sound-panel');
            const btn = document.getElementById('collapse-toggle');
            panel.classList.toggle('collapsed');
            if (panel.classList.contains('collapsed')) {
                btn.innerText = '▼';
            } else {
                btn.innerText = '▲';
            }
        }

        // --- 1. 50가지 힐링 명언 데이터베이스 ---
        const quotesData = [

            { category: "💡 깊은 생각", text: "과거의 후회와 미래의 불안을 내려놓으세요. 당신에게 가장 귀중한 시간은 바로 지금 이 순간입니다." },
            { category: "✨ 오늘의 위로", text: "오늘 하루도 애쓴 당신, 거창한 성취가 없어도 살아 숨 쉰다는 것만으로도 아름답습니다." },
            { category: "🌊 삶의 지혜", text: "밀려왔다 나가는 파도처럼, 잔잔한 삶의 걱정거리들도 거친 시련 끝에 자연스레 흘러갑니다." },
            { category: "🔥 내면의 온기", text: "어두운 밤일수록 작은 불꽃의 온기가 온 세상을 따뜻하게 채웁니다. 당신 안의 빛을 믿으세요." },
            { category: "🍃 휴식의 가치", text: "바쁜 걸음을 멈추고 잠시 멈춰 서서 바람 소리에 귀 기울이는 순간이 더 큰 전진을 만듭니다." },
            { category: "⭐ 희망의 메시지", text: "밤하늘의 별은 어둠이 깊어질수록 더욱 찬란하게 빛납니다. 당신도 곧 빛나게 될 거예요." },
            { category: "🌸 용기 한 스푼", text: "남들과 다른 속도로 걸어가도 괜찮습니다. 당신만의 올바른 방향으로 나아가고 있으니까요." },
            { category: "🌙 밤의 평온", text: "오늘 마음에 남았던 무거운 짐들은 조용히 떠오르는 밤하늘 별빛 아래 맡겨두고 편히 쉬세요." },
            { category: "🌿 마인드풀니스", text: "숨을 깊게 내쉬며 가슴속 차오르는 따스한 평온함에 온 신경을 집중해봅니다." },
            { category: "☕ 자기 자비", text: "자신에게 조금 더 관대해지세요. 세상에서 가장 따뜻하게 안아주어야 할 사람은 바로 당신입니다." },
            { category: "☀️ 새로운 시작", text: "지나간 어둠이 짙을수록 내일 아침 떠오를 햇살은 한층 더 감동적으로 다가옵니다." },
            { category: "🌊 수용과 내려놓음", text: "억지로 흘러가는 물결을 막으려 하지 마세요. 그대로 흘러가게 둘 때 비로소 평안해집니다." },
            { category: "🕯️ 나만의 속도", text: "빠르게 달리는 것보다 소중한 것은 내가 어떤 풍경을 보며 걸어가고 있는지 깨닫는 것입니다." },
            { category: "🪴 내면의 성숙", text: "비바람을 견뎌낸 나무만이 뿌리를 깊게 내리고 그늘을 만드는 울창한 숲이 됩니다." },
            { category: "🦋 변화의 시작", text: "애벌레가 고치를 뚫고 나가는 고통을 견뎌낼 때 비로소 아름다운 나비로 날아오릅니다." },
            { category: "🍂 내려놓기", text: "가을에 낙엽이 떨어지듯, 나를 괴롭히던 불필요한 집착들을 자연스럽게 흘려보내세요." },

            { category: "🧭 내면의 지혜", text: "길을 잃은 것 같아도 괜찮습니다. 멈춰 서서 가슴 소리에 집중하면 길은 다시 보입니다." },
            { category: "🌊 밀물과 썰물", text: "모든 것은 들어오면 나가기 마련입니다. 지금 부족함이 느껴져도 곧 채워짐이 시작됩니다." },
            { category: "🌱 자라나는 나무", text: "눈에 보이지 않아도 땅 밑에서 당신의 뿌리는 한층 더 견고하고 굳건하게 자라고 있습니다." },
            { category: "✨ 작은 행복", text: "따뜻한 차 한 잔, 좋은 음악 한 소절에서 느껴지는 감사함이 진정한 삶의 축복입니다." },
            { category: "🦋 날갯짓", text: "작은 나비의 날갯짓이 바람을 일으키듯 당신의 조그만 긍정의 선택이 삶을 변화시킵니다." },
            { category: "☀️ 햇살의 차오름", text: "어두운 구름 뒤에는 항상 변함없이 눈부신 태양이 우리를 기다리고 있습니다." },
            { category: "🌿 싱그러움", text: "새봄의 신선한 공기처럼 마음에 쌓인 찌꺼기들을 털어내고 매일 새로워지세요." },
            { category: "🕯️ 한 줄기 빛", text: "아무리 작은 희망의 끈이라도 잡고 있다면 당신은 결코 절망에 무너지지 않습니다." },
            { category: "🌊 넓은 바다", text: "강물이 결국 넓은 바다로 흘러가듯, 당신의 노력이 헛되지 않고 큰 결실을 맺을 것입니다." },
            { category: "🌙 달빛의 고요", text: "조용히 세상을 비추는 부드러운 달빛처럼 잔잔하고 기품 있게 하루를 마무리해보세요." },
            { category: "🌸 피어남", text: "당신이라는 꽃이 피어날 고유의 때가 반드시 찾아옵니다. 자신만의 피어남을 기다리세요." },
            { category: "🍃 상쾌한 바람", text: "가슴속 묵힌 걱정거리를 스쳐 지나가는 시원한 산바람 속에 훨훨 날려 보내세요." },
            { category: "⭐ 영원의 평온", text: "지구가 자전하듯 세상은 변하지만, 당신 안의 존엄한 가치는 영원히 빛나고 있습니다." },
            { category: "✨ 지금 이 순간", text: "숨을 쉬는 바로 지금, 당신은 이 세상에서 가장 귀하고 아름다운 존재임을 잊지 마세요." }
        ];

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotesData.length);
            const item = quotesData[randomIndex];
            document.getElementById('q-category').innerText = item.category;
            document.getElementById('q-text').innerText = `"${item.text}"`;
        }
        
        getRandomQuote();

        // --- 2. 3D 씬 및 환경 구성 ---
        let visualLevels = { fire: 0, wave: 0, rain: 0, wind: 0, cricket: 0 };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainSunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainSunLight.position.set(10, 20, 10);
        scene.add(mainSunLight);

        const fireLight = new THREE.PointLight(0xffaa33, 0.5, 12);
        fireLight.position.set(0, 0.8, 0);
        scene.add(fireLight);

        const floorGeo = new THREE.PlaneGeometry(90, 90);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a140a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const campfireGroup = new THREE.Group();
        const logMat = new THREE.MeshStandardMaterial({ color: 0x2b1704, roughness: 0.8 });
        for (let i = 0; i < 5; i++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.2, 8), logMat);
            log.rotation.z = Math.PI / 3;
            log.rotation.y = (i * Math.PI) / 2.5;
            log.position.y = 0.1;
            campfireGroup.add(log);
        }
        scene.add(campfireGroup);

        // 🔥 모닥불 불꽃 3D 파티클
        const fireParticleCount = 80;
        const fireGeo = new THREE.BufferGeometry();
        const firePos = new Float32Array(fireParticleCount * 3);
        for (let i = 0; i < fireParticleCount * 3; i += 3) {
            firePos[i] = (Math.random() - 0.5) * 0.4;
            firePos[i+1] = Math.random() * 0.8;
            firePos[i+2] = (Math.random() - 0.5) * 0.4;
        }
        fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
        const fireMat = new THREE.PointsMaterial({ color: 0xff5500, size: 0.15, transparent: true, opacity: 0 });
        const fireParticles = new THREE.Points(fireGeo, fireMat);
        scene.add(fireParticles);

        // 🌊 파도치는 물결 3D 파티클
        const waveParticleCount = 300;
        const waveGeo = new THREE.BufferGeometry();
        const wavePos = new Float32Array(waveParticleCount * 3);
        for (let i = 0; i < waveParticleCount * 3; i += 3) {
            wavePos[i] = (Math.random() - 0.5) * 70;
            wavePos[i+1] = 0.05;
            wavePos[i+2] = (Math.random() - 0.5) * 70;
        }
        waveGeo.setAttribute('position', new THREE.BufferAttribute(wavePos, 3));
        const waveMat = new THREE.PointsMaterial({ color: 0x77ccff, size: 0.25, transparent: true, opacity: 0 });
        const waveParticles = new THREE.Points(waveGeo, waveMat);
        scene.add(waveParticles);

        // 🌧️ 내리는 빗줄기 3D 파티클
        const rainParticleCount = 400;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainParticleCount * 3);
        for (let i = 0; i < rainParticleCount * 3; i += 3) {
            rainPos[i] = (Math.random() - 0.5) * 50;
            rainPos[i+1] = Math.random() * 20;
            rainPos[i+2] = (Math.random() - 0.5) * 50;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12, transparent: true, opacity: 0 });
        const rainParticles = new THREE.Points(rainGeo, rainMat);
        scene.add(rainParticles);

        const treeGroup = new THREE.Group();
        scene.add(treeGroup);
        const trees = [];
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x0f401b, roughness: 0.8 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a1108 });

        for (let i = 0; i < 45; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 4.5 + Math.random() * 25;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 3.5, 6), trunkMat);
            trunk.position.set(x, 1.75, z);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.5, 6), leavesMat);
            leaves.position.set(x, 4, z);

            treeGroup.add(trunk);
            treeGroup.add(leaves);
            trees.push({ leaves });
        }

        // 🦗 반딧불이 대기 입자
        const particleCount = 250;
        const envGeo = new THREE.BufferGeometry();
        const envPos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            envPos[i] = (Math.random() - 0.5) * 45;
            envPos[i+1] = Math.random() * 10;
            envPos[i+2] = (Math.random() - 0.5) * 45;
        }
        envGeo.setAttribute('position', new THREE.BufferAttribute(envPos, 3));
        const envMat = new THREE.PointsMaterial({ color: 0xaaff88, size: 0.16, transparent: true, opacity: 0.3 });
        const envParticles = new THREE.Points(envGeo, envMat);
        scene.add(envParticles);

        // --- 3. 시간대별 테마 ---
        const timeConfigs = {
            dawn: { fog: 0x1b1c30, bg: 0x1b1c30, ambient: 0x333b55, sunColor: 0xffaa88, sunIntensity: 0.6, leavesColor: 0x1f3a38, particleColor: 0xddaaff },
            morning: { fog: 0x87ceeb, bg: 0x87ceeb, ambient: 0x667788, sunColor: 0xffffff, sunIntensity: 1.2, leavesColor: 0x2e6f40, particleColor: 0xffffff },
            noon: { fog: 0xa0e0ff, bg: 0xa0e0ff, ambient: 0x8899aa, sunColor: 0xffffff, sunIntensity: 1.6, leavesColor: 0x1e8238, particleColor: 0xffffff },
            sunset: { fog: 0x3b1510, bg: 0x3b1510, ambient: 0x663322, sunColor: 0xff6633, sunIntensity: 1.4, leavesColor: 0x4a2511, particleColor: 0xffaa44 },
            night: { fog: 0x050510, bg: 0x050510, ambient: 0x111122, sunColor: 0x4466aa, sunIntensity: 0.4, leavesColor: 0x0b2414, particleColor: 0xaaff88 }
        };

        function setTimeOfDay(timeKey) {
            const cfg = timeConfigs[timeKey];
            scene.fog = new THREE.FogExp2(cfg.fog, 0.02);
            renderer.setClearColor(cfg.bg);
            ambientLight.color.setHex(cfg.ambient);
            mainSunLight.color.setHex(cfg.sunColor);
            mainSunLight.intensity = cfg.sunIntensity;
            leavesMat.color.setHex(cfg.leavesColor);
            envMat.color.setHex(cfg.particleColor);

            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        }

        setTimeOfDay('night');

        // --- 4. 유튜브 원본 ASMR 링크 연동 플레이어 ---
        let players = {};
        let isGlobalMuted = false;

        function onYouTubeIframeAPIReady() {
            players['fire'] = new YT.Player('yt-fire', { height: '0', width: '0', videoId: 'N_g3AiXF-q8', playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'N_g3AiXF-q8' } });
            players['wave'] = new YT.Player('yt-wave', { height: '0', width: '0', videoId: 'n4Mdh3TEq_k', playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'n4Mdh3TEq_k' } });
            players['rain'] = new YT.Player('yt-rain', { height: '0', width: '0', videoId: 'lQ0fS2meTYQ', playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'lQ0fS2meTYQ' } });
            players['wind'] = new YT.Player('yt-wind', { height: '0', width: '0', videoId: 'KKi2qiuZZWQ', playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'KKi2qiuZZWQ' } });
            players['cricket'] = new YT.Player('yt-cricket', { height: '0', width: '0', videoId: 'WPlZUsbWqBc', playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'WPlZUsbWqBc' } });
        }

        function handleVolumeChange(soundKey, volumeValue) {
            document.getElementById(`val-${soundKey}`).innerText = volumeValue;
            visualLevels[soundKey] = volumeValue / 100;

            if (players[soundKey] && typeof players[soundKey].setVolume === 'function') {
                players[soundKey].setVolume(volumeValue);
                if (volumeValue > 0) {
                    if (players[soundKey].getPlayerState() !== YT.PlayerState.PLAYING) {
                        players[soundKey].playVideo();
                    }
                } else {
                    players[soundKey].pauseVideo();
                }
            }
        }

        document.getElementById('vol-fire').addEventListener('input', e => handleVolumeChange('fire', e.target.value));
        document.getElementById('vol-wave').addEventListener('input', e => handleVolumeChange('wave', e.target.value));
        document.getElementById('vol-rain').addEventListener('input', e => handleVolumeChange('rain', e.target.value));
        document.getElementById('vol-wind').addEventListener('input', e => handleVolumeChange('wind', e.target.value));
        document.getElementById('vol-cricket').addEventListener('input', e => handleVolumeChange('cricket', e.target.value));

        document.getElementById('audio-toggle').addEventListener('click', (e) => {
            isGlobalMuted = !isGlobalMuted;
            Object.keys(players).forEach(key => {
                if (players[key] && typeof players[key].mute === 'function') {
                    if (isGlobalMuted) players[key].mute();
                    else players[key].unMute();
                }
            });
            e.target.textContent = isGlobalMuted ? '🔇' : '🔊';
        });

        // --- 5. 마우스 및 터치 시점 제어 (모바일 터치 완벽 지원) ---
        let isDragging = false;
        let previousPosition = { x: 0, y: 0 };
        let cameraAngle = 0;

        function updateCameraAngle(deltaX) {
            cameraAngle -= deltaX * 0.004;
            camera.position.x = Math.sin(cameraAngle) * 9;
            camera.position.z = Math.cos(cameraAngle) * 9;
            camera.lookAt(0, 1.2, 0);
        }

        // PC 마우스 이벤트
        window.addEventListener('mousedown', (e) => { 
            isDragging = true; 
            previousPosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousPosition.x;
                updateCameraAngle(deltaX);
            }
            previousPosition = { x: e.clientX, y: e.clientY };
        });

        // 모바일 터치 이벤트
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - previousPosition.x;
                updateCameraAngle(deltaX);
                previousPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });

        // --- 6. 애니메이션 루프 (3D 시각 효과 연동) ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 🔥 1. 모닥불 불꽃 & 조명 연동
            const fireLvl = visualLevels.fire;
            fireMat.opacity = fireLvl * 0.9;
            fireLight.intensity = 0.5 + fireLvl * 3.5 + Math.sin(time * 12) * (0.2 + fireLvl * 0.5);

            const fPos = fireGeo.attributes.position.array;
            for (let i = 1; i < fPos.length; i += 3) {
                fPos[i] += 0.005 + fireLvl * 0.015;
                if (fPos[i] > 0.3 + fireLvl * 1.0) fPos[i] = 0;
            }
            fireGeo.attributes.position.needsUpdate = true;

            // 🌊 2. 파도치는 물결 연동
            const waveLvl = visualLevels.wave;
            waveMat.opacity = waveLvl * 0.75;
            const wPos = waveGeo.attributes.position.array;
            for (let i = 0; i < wPos.length; i += 3) {
                wPos[i+1] = Math.sin(time * 2 + wPos[i] * 0.1) * (0.1 + waveLvl * 0.6);
            }
            waveGeo.attributes.position.needsUpdate = true;

            // 🌧️ 3. 내리는 빗줄기 연동
            const rainLvl = visualLevels.rain;
            rainMat.opacity = rainLvl * 0.8;
            const rPos = rainGeo.attributes.position.array;
            for (let i = 1; i < rPos.length; i += 3) {
                rPos[i] -= 0.15 + rainLvl * 0.35;
                if (rPos[i] < 0) rPos[i] = 20;
            }
            rainGeo.attributes.position.needsUpdate = true;

            // 🍃 4. 바람 부는 숲 흔들림 연동
            const windLvl = visualLevels.wind;
            trees.forEach((tree, idx) => {
                tree.leaves.rotation.z = Math.sin(time * (1.5 + windLvl * 3) + idx) * (0.02 + windLvl * 0.12);
            });

            // 🦗 5. 반딧불이 연동
            const cricketLvl = visualLevels.cricket;
            envMat.opacity = 0.3 + cricketLvl * 0.6;
            envMat.size = 0.16 + cricketLvl * 0.1;
            const ePos = envGeo.attributes.position.array;
            for (let i = 1; i < ePos.length; i += 3) {
                ePos[i] += Math.sin(time * (1 + cricketLvl * 2) + i) * 0.004;
            }
            envGeo.attributes.position.needsUpdate = true;

            camera.lookAt(0, 1.2, 0);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
