<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 입체 힐링 숲 스페이스</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            user-select: none;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(18, 20, 32, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        /* 좌측 상단: 배경 테마 고정 선택 */
        .time-container {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 14px 18px;
            z-index: 10;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
        }
        .time-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .time-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            padding: 6px 11px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .time-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .time-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* 우측 상단: 사운드 믹서 */
        .sound-container {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 16px;
            width: 260px;
            z-index: 10;
        }
        .sound-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .audio-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }
        .sound-control {
            margin-bottom: 10px;
        }
        .sound-control label {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: rgba(255, 255, 255, 0.85);
        }
        .sound-control input[type=range] {
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
            outline: none;
        }
        .sound-control input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* 하단: 힐링 명언 위젯 */
        .quote-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 28px;
            max-width: 650px;
            width: 90%;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .quote-category {
            font-size: 10px;
            letter-spacing: 1px;
            color: #ffd700;
            text-transform: uppercase;
            font-weight: 600;
        }
        .quote-text {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.95);
        }
        .refresh-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            margin-top: 4px;
        }
        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단: 배경 테마 -->
    <div class="glass-panel time-container">
        <div class="panel-title">BACKGROUND THEME</div>
        <div class="time-buttons">
            <button class="time-btn" onclick="setTimeOfDay('dawn')">🌌 새벽</button>
            <button class="time-btn" onclick="setTimeOfDay('morning')">🌅 아침</button>
            <button class="time-btn" onclick="setTimeOfDay('noon')">☀️ 점심</button>
            <button class="time-btn" onclick="setTimeOfDay('sunset')">🌇 저녁</button>
            <button class="time-btn active" onclick="setTimeOfDay('night')">🌙 밤</button>
        </div>
    </div>

    <!-- 우측 상단: 5가지 맞춤 사운드 믹서 -->
    <div class="glass-panel sound-container">
        <div class="sound-header">
            <span class="panel-title" style="margin:0;">CUSTOM ASMR MIXER</span>
            <button class="audio-toggle-btn" id="audio-toggle">🔇</button>
        </div>
        <div class="sound-control">
            <label>🔥 모닥불 (토도독 타탁) <span id="val-fire">0.0</span></label>
            <input type="range" id="vol-fire" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>🌊 파도 (스테레오 균형) <span id="val-wave">0.0</span></label>
            <input type="range" id="vol-wave" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>💧 잔잔한 물방울 <span id="val-rain">0.0</span></label>
            <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>🍃 귓가 스치는 바람 <span id="val-wind">0.0</span></label>
            <input type="range" id="vol-wind" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>🦗 풀벌레·새·풀잎 <span id="val-cricket">0.0</span></label>
            <input type="range" id="vol-cricket" min="0" max="1" step="0.01" value="0.0">
        </div>
    </div>

    <!-- 하단: 힐링 명언 위젯 -->
    <div class="glass-panel quote-container">
        <div class="quote-category" id="q-category">✨ 오늘의 위로</div>
        <div class="quote-text" id="q-text">"마음의 속도를 줄이고, 지금 이 순간 스쳐 지나가는 온기에 집중해보세요."</div>
        <button class="refresh-btn" onclick="getRandomQuote()">🔄 다른 문장 보기</button>
    </div>

    <!-- Three.js 엔진 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 50가지 힐링 명언 데이터베이스 ---
        const quotesData = [
            { category: "🌱 마음 조언", text: "모든 일에는 저마다의 계절이 있습니다. 꽃을 피울 준비를 하는 당신의 시간을 믿어주세요." },
            { category: "💡 깊은 생각", text: "과거의 후회와 미래의 불안을 내려놓으세요. 당신에게 가장 귀중한 시간은 바로 지금 이 순간입니다." },
            { category: "✨ 오늘의 위로", text: "오늘 하루도 애쓴 당신, 거창한 성취가 없어도 살아 숨 쉰다는 것만으로도 아름답습니다." },
            { category: "🌊 삶의 지혜", text: "밀려왔다 나가는 파도처럼, 잔잔한 삶의 걱정거리들도 거친 시련 끝에 자연스레 흘러갑니다." },
            { category: "🔥 내면의 온기", text: "어두운 밤일수록 작은 불꽃의 온기가 온 세상을 따뜻하게 채웁니다. 당신 안의 빛을 믿으세요." },
            { category: "🍃 휴식의 가치", text: "바쁜 걸음을 멈추고 잠시 멈춰 서서 바람 소리에 귀 기울이는 순간이 더 큰 전진을 만듭니다." },
            { category: "⭐ 희망의 메시지", text: "밤하늘의 별은 어둠이 깊어질수록 더욱 찬란하게 빛납니다. 당신도 곧 빛나게 될 거예요." },
            { category: "🌸 용기 한 스푼", text: "남들과 다른 속도로 걸어가도 괜찮습니다. 당신만의 올바른 방향으로 나아가고 있으니까요." },
            { category: "🌙 밤의 평온", text: "오늘 마음에 남았던 무거운 짐들은 조용히 떠오르는 밤하늘 별빛 아래 맡겨두고 편히 쉬세요." },
            { category: "🌿 마인드풀니스", text: "숨을 깊게 내쉬며 가슴속 차오르는 따스한 평온함에 온 신경을 집중해봅니다." },
            { category: "☕ 자기 자비", text: "자신에게 조금 더 관대해지세요. 세상에서 가장 따뜻하게 안아주어야 할 사람은 바로 당신입니다." },
            { category: "☀️ 새로운 시작", text: "지나간 어둠이 짙을수록 내일 아침 떠오를 햇살은 한층 더 감동적으로 다가옵니다." },
            { category: "🌊 수용과 내려놓음", text: "억지로 흘러가는 물결을 막으려 하지 마세요. 그대로 흘러가게 둘 때 비로소 평안해집니다." },
            { category: "🕯️ 나만의 속도", text: "빠르게 달리는 것보다 소중한 것은 내가 어떤 풍경을 보며 걸어가고 있는지 깨닫는 것입니다." },
            { category: "🪴 내면의 성숙", text: "비바람을 견뎌낸 나무만이 뿌리를 깊게 내리고 그늘을 만드는 울창한 숲이 됩니다." },
            { category: "🦋 변화의 시작", text: "애벌레가 고치를 뚫고 나가는 고통을 견뎌낼 때 비로소 아름다운 나비로 날아오릅니다." },
            { category: "🍂 내려놓기", text: "가을에 낙엽이 떨어지듯, 나를 괴롭히던 불필요한 집착들을 자연스럽게 흘려보내세요." },
            { category: "❄️ 겨울 뒤의 봄", text: "아무리 맹렬한 추위도 결국 스러지고, 땅 밑에 숨어있던 봄싹은 마침내 피어납니다." },
            { category: "🌟 스스로의 가치", text: "누군가의 인정보다 중요한 것은 스스로를 소중히 여기고 존중하는 진실된 마음입니다." },
            { category: "🕊️ 평화로운 마음", text: "고요함은 외부에 있는 것이 아니라, 파도치는 마음의 깊은 바닥을 바라볼 때 찾아옵니다." },
            { category: "💖 나를 위한 시간", text: "세상의 소란스러움에서 한 걸음 물러나 오롯이 나와 대화하는 소중한 힐링을 선사하세요." },
            { category: "🎶 삶의 리듬", text: "삶에도 강약이 필요합니다. 쉴 땐 확실히 쉬어갈 줄 아는 것이 가장 현명한 지혜입니다." },
            { category: "🌈 무지개의 약속", text: "한 줄기 굵은 빗줄기가 지나간 뒤에야 비로소 맑은 하늘에 영롱한 무지개가 피어납니다." },
            { category: "🌾 겸손과 성찰", text: "벼가 고개를 숙이듯 깊어질수록 타인을 품어줄 수 있는 여유롭고 넉넉한 사람이 됩니다." },
            { category: "🔮 감사하는 마음", text: "일상의 소소한 선물들에 감사할 때 마음속 행복의 크기는 무한히 넓어집니다." },
            { category: "🕯️ 밝은 등불", text: "내가 먼저 따뜻한 등불이 되어주면 주변의 어둠도 자연스레 밝은 온기로 물들어갑니다." },
            { category: "🌊 파도의 가르침", text: "높은 파도가 닥쳐와도 조용히 조화를 이루며 넘어갈 수 있는 내면의 힘이 당신에게 있습니다." },
            { category: "🍃 잔잔한 흔들림", text: "바람에 흔들릴지언정 부러지지 않는 버드나무처럼 유연하게 하루를 유영해 보세요." },
            { category: "☀️ 온전한 휴식", text: "충전이 필요한 순간에는 아무것도 하지 않아도 괜찮습니다. 휴식도 당당한 삶의 과정입니다." },
            { category: "🌟 빛나는 소신", text: "남의 시선에 흔들리지 말고 당신의 가슴이 가리키는 나침반의 방향대로 당당히 나아가세요." },
            { category: "🌸 소박한 기쁨", text: "길가에 피어난 조그만 들꽃 하나에도 깊은 감동을 느낄 수 있는 순수한 마음을 지키세요." },
            { category: "🔮 꿈을 향한 걸음", text: "원대한 목표도 오늘 작은 한 걸음부터 시작됩니다. 조급함 대신 꾸준함을 택하세요." },
            { category: "🌙 은은한 밤기운", text: "오늘 겪었던 모든 아쉬움은 깊은 밤의 정적 속으로 흩어지게 두고 편히 잠청하세요." },
            { category: "🌾 온유함의 힘", text: "강함은 부드러움을 이길 수 없습니다. 타인과 나를 부드럽게 감싸 안는 마음을 품으세요." },
            { category: "🔥 타오르는 불꽃", text: "내면의 열정이 꺼지지 않도록 꾸준히 당신이 좋아하는 일로 영혼을 채워주세요." },
            { category: "💧 이슬방울", text: "새벽녘 나뭇잎 끝에 맺힌 맑은 이슬처럼 맑고 맑은 마음으로 세상을 바라보세요." },
            { category: "🧭 내면의 지혜", text: "길을 잃은 것 같아도 괜찮습니다. 멈춰 서서 가슴 소리에 집중하면 길은 다시 보입니다." },
            { category: "🌊 밀물과 썰물", text: "모든 것은 들어오면 나가기 마련입니다. 지금 부족함이 느껴져도 곧 채워짐이 시작됩니다." },
            { category: "🌱 자라나는 나무", text: "눈에 보이지 않아도 땅 밑에서 당신의 뿌리는 한층 더 견고하고 굳건하게 자라고 있습니다." },
            { category: "✨ 작은 행복", text: "따뜻한 차 한 잔, 좋은 음악 한 소절에서 느껴지는 감사함이 진정한 삶의 축복입니다." },
            { category: "🦋 날갯짓", text: "작은 나비의 날갯짓이 바람을 일으키듯 당신의 조그만 긍정의 선택이 삶을 변화시킵니다." },
            { category: "☀️ 햇살의 차오름", text: "어두운 구름 뒤에는 항상 변함없이 눈부신 태양이 우리를 기다리고 있습니다." },
            { category: "🌿 싱그러움", text: "새봄의 신선한 공기처럼 마음에 쌓인 찌꺼기들을 털어내고 매일 새로워지세요." },
            { category: "🕯️ 한 줄기 빛", text: "아무리 작은 희망의 끈이라도 잡고 있다면 당신은 결코 절망에 무너지지 않습니다." },
            { category: "🌊 넓은 바다", text: "강물이 결국 넓은 바다로 흘러가듯, 당신의 노력이 헛되지 않고 큰 결실을 맺을 것입니다." },
            { category: "🌙 달빛의 고요", text: "조용히 세상을 비추는 부드러운 달빛처럼 잔잔하고 기품 있게 하루를 마무리해보세요." },
            { category: "🌸 피어남", text: "당신이라는 꽃이 피어날 고유의 때가 반드시 찾아옵니다. 자신만의 피어남을 기다리세요." },
            { category: "🍃 상쾌한 바람", text: "가슴속 묵힌 걱정거리를 스쳐 지나가는 시원한 산바람 속에 훨훨 날려 보내세요." },
            { category: "⭐ 영원의 평온", text: "지구가 자전하듯 세상은 변하지만, 당신 안의 존엄한 가치는 영원히 빛나고 있습니다." },
            { category: "✨ 지금 이 순간", text: "숨을 쉬는 바로 지금, 당신은 이 세상에서 가장 귀하고 아름다운 존재임을 잊지 마세요." }
        ];

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotesData.length);
            const item = quotesData[randomIndex];
            document.getElementById('q-category').innerText = item.category;
            document.getElementById('q-text').innerText = `"${item.text}"`;
        }
        
        getRandomQuote();

        // --- 2. 3D 씬 및 환경 구성 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainSunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainSunLight.position.set(10, 20, 10);
        scene.add(mainSunLight);

        const fireLight = new THREE.PointLight(0xffaa33, 2.5, 12);
        fireLight.position.set(0, 0.8, 0);
        scene.add(fireLight);

        const floorGeo = new THREE.PlaneGeometry(90, 90);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a140a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const campfireGroup = new THREE.Group();
        const logMat = new THREE.MeshStandardMaterial({ color: 0x2b1704, roughness: 0.8 });
        for (let i = 0; i < 5; i++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.2, 8), logMat);
            log.rotation.z = Math.PI / 3;
            log.rotation.y = (i * Math.PI) / 2.5;
            log.position.y = 0.1;
            campfireGroup.add(log);
        }
        scene.add(campfireGroup);

        const fireParticleCount = 50;
        const fireGeo = new THREE.BufferGeometry();
        const firePos = new Float32Array(fireParticleCount * 3);
        for (let i = 0; i < fireParticleCount * 3; i += 3) {
            firePos[i] = (Math.random() - 0.5) * 0.4;
            firePos[i+1] = Math.random() * 0.8;
            firePos[i+2] = (Math.random() - 0.5) * 0.4;
        }
        fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
        const fireMat = new THREE.PointsMaterial({ color: 0xff6600, size: 0.15, transparent: true, opacity: 0.8 });
        const fireParticles = new THREE.Points(fireGeo, fireMat);
        scene.add(fireParticles);

        const treeGroup = new THREE.Group();
        scene.add(treeGroup);
        const trees = [];
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x0f401b, roughness: 0.8 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a1108 });

        for (let i = 0; i < 45; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 4.5 + Math.random() * 25;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 3.5, 6), trunkMat);
            trunk.position.set(x, 1.75, z);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.5, 6), leavesMat);
            leaves.position.set(x, 4, z);

            treeGroup.add(trunk);
            treeGroup.add(leaves);
            trees.push({ leaves });
        }

        const particleCount = 220;
        const envGeo = new THREE.BufferGeometry();
        const envPos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            envPos[i] = (Math.random() - 0.5) * 45;
            envPos[i+1] = Math.random() * 10;
            envPos[i+2] = (Math.random() - 0.5) * 45;
        }
        envGeo.setAttribute('position', new THREE.BufferAttribute(envPos, 3));
        const envMat = new THREE.PointsMaterial({ color: 0xaaff88, size: 0.16, transparent: true, opacity: 0.7 });
        const envParticles = new THREE.Points(envGeo, envMat);
        scene.add(envParticles);

        // --- 3. 시간대별 테마 ---
        const timeConfigs = {
            dawn: { fog: 0x1b1c30, bg: 0x1b1c30, ambient: 0x333b55, sunColor: 0xffaa88, sunIntensity: 0.6, leavesColor: 0x1f3a38, particleColor: 0xddaaff },
            morning: { fog: 0x87ceeb, bg: 0x87ceeb, ambient: 0x667788, sunColor: 0xffffff, sunIntensity: 1.2, leavesColor: 0x2e6f40, particleColor: 0xffffff },
            noon: { fog: 0xa0e0ff, bg: 0xa0e0ff, ambient: 0x8899aa, sunColor: 0xffffff, sunIntensity: 1.6, leavesColor: 0x1e8238, particleColor: 0xffffff },
            sunset: { fog: 0x3b1510, bg: 0x3b1510, ambient: 0x663322, sunColor: 0xff6633, sunIntensity: 1.4, leavesColor: 0x4a2511, particleColor: 0xffaa44 },
            night: { fog: 0x050510, bg: 0x050510, ambient: 0x111122, sunColor: 0x4466aa, sunIntensity: 0.4, leavesColor: 0x0b2414, particleColor: 0xaaff88 }
        };

        function setTimeOfDay(timeKey) {
            const cfg = timeConfigs[timeKey];
            scene.fog = new THREE.FogExp2(cfg.fog, 0.02);
            renderer.setClearColor(cfg.bg);
            ambientLight.color.setHex(cfg.ambient);
            mainSunLight.color.setHex(cfg.sunColor);
            mainSunLight.intensity = cfg.sunIntensity;
            leavesMat.color.setHex(cfg.leavesColor);
            envMat.color.setHex(cfg.particleColor);

            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        }

        setTimeOfDay('night');

        // --- 4. 요청사항이 모두 반영된 커스텀 오디오 엔진 ---
        let audioCtx = null;
        let masterGain = null;
        let fireGain, waveGain, rainGain, windGain, cricketGain;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            masterGain.connect(audioCtx.destination);

            function createPureNoiseNode(type, freq) {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                src.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = type;
                filter.frequency.value = freq;

                src.connect(filter);
                src.start(0);
                return filter;
            }

            // 1. 모닥불소리: "토도독 톡톡 탁탁 타타타탁 토톡 탁탁" 불규칙 장작 타는 소리
            fireGain = audioCtx.createGain();
            fireGain.gain.value = parseFloat(document.getElementById('vol-fire').value);
            createPureNoiseNode('bandpass', 400).connect(fireGain);

            function scheduleCrackles() {
                if (!audioCtx) return;
                if (fireGain && fireGain.gain.value > 0.001) {
                    const burstCount = Math.floor(Math.random() * 4) + 1; // 불규칙한 타수 발생 (타타타탁 구현)
                    for (let b = 0; b < burstCount; b++) {
                        setTimeout(() => {
                            if (!audioCtx || fireGain.gain.value <= 0.001) return;
                            const osc = audioCtx.createOscillator();
                            const g = audioCtx.createGain();
                            osc.type = (Math.random() > 0.4) ? 'triangle' : 'sine';
                            osc.frequency.setValueAtTime(1200 + Math.random() * 3200, audioCtx.currentTime);
                            
                            const dur = 0.01 + Math.random() * 0.025;
                            g.gain.setValueAtTime(0.1 + Math.random() * 0.08, audioCtx.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);

                            osc.connect(g);
                            g.connect(fireGain);
                            osc.start();
                            osc.stop(audioCtx.currentTime + dur + 0.01);
                        }, b * (30 + Math.random() * 50));
                    }
                }
                setTimeout(scheduleCrackles, 150 + Math.random() * 450);
            }
            scheduleCrackles();
            fireGain.connect(masterGain);

            // 2. 파도소리: 이어폰 좌우 밸런스 균형 배치 (스테레오 균일화)
            waveGain = audioCtx.createGain();
            waveGain.gain.value = parseFloat(document.getElementById('vol-wave').value);
            const waveFilter = createPureNoiseNode('lowpass', 280);
            waveFilter.connect(waveGain);

            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 0.1;
            const waveLfoGain = audioCtx.createGain();
            waveLfoGain.gain.value = 200;
            lfo.connect(waveLfoGain);
            waveLfoGain.connect(waveFilter.frequency);
            lfo.start();
            waveGain.connect(masterGain);

            // 3. 비내리는소리: 잔잔한 물방울(Droplets) 떨어지는 소리 합성
            rainGain = audioCtx.createGain();
            rainGain.gain.value = parseFloat(document.getElementById('vol-rain').value);
            
            function scheduleDroplets() {
                if (!audioCtx) return;
                if (rainGain && rainGain.gain.value > 0.001) {
                    const dropOsc = audioCtx.createOscillator();
                    const dropGain = audioCtx.createGain();
                    dropOsc.type = 'sine';
                    const startFreq = 1800 + Math.random() * 1200;
                    dropOsc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                    dropOsc.frequency.exponentialRampToValueAtTime(startFreq * 0.7, audioCtx.currentTime + 0.08);

                    dropGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    dropGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);

                    dropOsc.connect(dropGain);
                    dropGain.connect(rainGain);
                    dropOsc.start();
                    dropOsc.stop(audioCtx.currentTime + 0.09);
                }
                setTimeout(scheduleDroplets, 40 + Math.random() * 120);
            }
            scheduleDroplets();
            createPureNoiseNode('lowpass', 800).connect(rainGain); // 배경 빗방울 잔향
            rainGain.connect(masterGain);

            // 4. 바람소리: 거부감 없는 부드러운 귓가 스침(Soft Breeze)
            windGain = audioCtx.createGain();
            windGain.gain.value = parseFloat(document.getElementById('vol-wind').value);
            const windFilter = createPureNoiseNode('bandpass', 180);
            windFilter.connect(windGain);

            const windLfo = audioCtx.createOscillator();
            windLfo.frequency.value = 0.2; // 부드러운 바람결 주기
            const windLfoGain = audioCtx.createGain();
            windLfoGain.gain.value = 80;
            windLfo.connect(windLfoGain);
            windLfoGain.connect(windFilter.frequency);
            windLfo.start();
            windGain.connect(masterGain);

            // 5. 풀벌레소리: 귀뚜라미 울음 + 짹짹 새소리 + 풀잎 하늘거리는 소리 하모니
            cricketGain = audioCtx.createGain();
            cricketGain.gain.value = parseFloat(document.getElementById('vol-cricket').value);
            
            // 귀뚜라미 찌르르
            function playCricket() {
                if (!audioCtx || !cricketGain || cricketGain.gain.value < 0.001) {
                    setTimeout(playCricket, 400);
                    return;
                }
                const cOsc = audioCtx.createOscillator();
                const cGain = audioCtx.createGain();
                cOsc.type = 'sawtooth';
                cOsc.frequency.setValueAtTime(4500 + Math.random() * 200, audioCtx.currentTime);
                cGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                cGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                cOsc.connect(cGain);
                cGain.connect(cricketGain);
                cOsc.start();
                cOsc.stop(audioCtx.currentTime + 0.16);
                setTimeout(playCricket, 300 + Math.random() * 400);
            }
            playCricket();

            // 짹짹 새소리
            function playBird() {
                if (!audioCtx || !cricketGain || cricketGain.gain.value < 0.001) {
                    setTimeout(playBird, 2000);
                    return;
                }
                const bOsc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                bOsc.type = 'sine';
                bOsc.frequency.setValueAtTime(3000 + Math.random() * 800, audioCtx.currentTime);
                bOsc.frequency.exponentialRampToValueAtTime(3800 + Math.random() * 500, audioCtx.currentTime + 0.1);
                bGain.gain.setValueAtTime(0.025, audioCtx.currentTime);
                bGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
                bOsc.connect(bGain);
                bGain.connect(cricketGain);
                bOsc.start();
                bOsc.stop(audioCtx.currentTime + 0.13);
                setTimeout(playBird, 2500 + Math.random() * 4000);
            }
            playBird();

            // 풀잎 마찰음 (사락사락)
            const grassNoise = createPureNoiseNode('bandpass', 2500);
            const grassGain = audioCtx.createGain();
            grassGain.gain.value = 0.4;
            grassNoise.connect(grassGain);
            grassGain.connect(cricketGain);

            cricketGain.connect(masterGain);

            isAudioInitialized = true;
        }

        // 슬라이더 바인딩
        document.getElementById('vol-fire').addEventListener('input', e => { initAudio(); if(fireGain) fireGain.gain.value = e.target.value; document.getElementById('val-fire').innerText = e.target.value; });
        document.getElementById('vol-wave').addEventListener('input', e => { initAudio(); if(waveGain) waveGain.gain.value = e.target.value; document.getElementById('val-wave').innerText = e.target.value; });
        document.getElementById('vol-rain').addEventListener('input', e => { initAudio(); if(rainGain) rainGain.gain.value = e.target.value; document.getElementById('val-rain').innerText = e.target.value; });
        document.getElementById('vol-wind').addEventListener('input', e => { initAudio(); if(windGain) windGain.gain.value = e.target.value; document.getElementById('val-wind').innerText = e.target.value; });
        document.getElementById('vol-cricket').addEventListener('input', e => { initAudio(); if(cricketGain) cricketGain.gain.value = e.target.value; document.getElementById('val-cricket').innerText = e.target.value; });

        window.addEventListener('click', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        let isMuted = false;
        document.getElementById('audio-toggle').addEventListener('click', (e) => {
            initAudio();
            isMuted = !isMuted;
            masterGain.gain.value = isMuted ? 0 : 1.0;
            e.target.textContent = isMuted ? '🔇' : '🔊';
        });

        // --- 5. 마우스 시점 제어 ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;

        window.addEventListener('mousedown', () => { isDragging = true; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                cameraAngle -= deltaX * 0.004;
                camera.position.x = Math.sin(cameraAngle) * 9;
                camera.position.z = Math.cos(cameraAngle) * 9;
                camera.lookAt(0, 1.2, 0);
            }
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        // --- 6. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            fireLight.intensity = 2.0 + Math.sin(time * 10) * 0.4 + Math.cos(time * 19) * 0.3;

            const fPos = fireGeo.attributes.position.array;
            for (let i = 1; i < fPos.length; i += 3) {
                fPos[i] += 0.008;
                if (fPos[i] > 1.0) fPos[i] = 0;
            }
            fireGeo.attributes.position.needsUpdate = true;

            const ePos = envGeo.attributes.position.array;
            for (let i = 1; i < ePos.length; i += 3) {
                ePos[i] += Math.sin(time + i) * 0.003;
            }
            envGeo.attributes.position.needsUpdate = true;

            trees.forEach((tree, idx) => {
                tree.leaves.rotation.z = Math.sin(time * 1.2 + idx) * 0.02;
            });

            camera.lookAt(0, 1.2, 0);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
