<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 입체 힐링 숲 스페이스</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            user-select: none;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(18, 20, 32, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        /* 좌측 상단: 시간대 테마 패널 */
        .time-container {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 14px 18px;
            z-index: 10;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
        }
        .time-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .time-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            padding: 6px 11px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .time-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .time-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* 우측 상단: 5대 입체 ASMR 믹서 패널 */
        .sound-container {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 16px;
            width: 240px;
            z-index: 10;
        }
        .sound-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .audio-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }
        .sound-control {
            margin-bottom: 9px;
        }
        .sound-control label {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: rgba(255, 255, 255, 0.85);
        }
        .sound-control input[type=range] {
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
            outline: none;
        }
        .sound-control input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* 하단: 힐링 명언 & 조언 패널 */
        .quote-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 28px;
            max-width: 620px;
            width: 90%;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .quote-category {
            font-size: 10px;
            letter-spacing: 1px;
            color: #ffd700;
            text-transform: uppercase;
            font-weight: 600;
        }
        .quote-text {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.95);
        }
        .refresh-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            margin-top: 4px;
        }
        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단: 시간대 테마 -->
    <div class="glass-panel time-container">
        <div class="panel-title">ATMOSPHERE TIME</div>
        <div class="time-buttons">
            <button class="time-btn" onclick="setTimeOfDay('dawn')">🌌 새벽</button>
            <button class="time-btn" onclick="setTimeOfDay('morning')">🌅 아침</button>
            <button class="time-btn" onclick="setTimeOfDay('noon')">☀️ 점심</button>
            <button class="time-btn" onclick="setTimeOfDay('sunset')">🌇 저녁</button>
            <button class="time-btn active" onclick="setTimeOfDay('night')">🌙 밤</button>
        </div>
    </div>

    <!-- 우측 상단: 5가지 3D 입체 ASMR 믹서 (기본값 모두 0.0) -->
    <div class="glass-panel sound-container">
        <div class="sound-header">
            <span class="panel-title" style="margin:0;">3D SPATIAL ASMR</span>
            <button class="audio-toggle-btn" id="audio-toggle">🔇</button>
        </div>
        <div class="sound-control">
            <label>🔥 모닥불 소리 <span id="val-fire">0.0</span></label>
            <input type="range" id="vol-fire" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>🌊 파도 소리 <span id="val-wave">0.0</span></label>
            <input type="range" id="vol-wave" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>🌧️ 비내리는 소리 <span id="val-rain">0.0</span></label>
            <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>💨 바람 소리 <span id="val-wind">0.0</span></label>
            <input type="range" id="vol-wind" min="0" max="1" step="0.01" value="0.0">
        </div>
        <div class="sound-control">
            <label>🦗 풀벌레 소리 <span id="val-cricket">0.0</span></label>
            <input type="range" id="vol-cricket" min="0" max="1" step="0.01" value="0.0">
        </div>
    </div>

    <!-- 하단: 힐링 명언 & 조언 위젯 -->
    <div class="glass-panel quote-container">
        <div class="quote-category" id="q-category">✨ 오늘의 위로</div>
        <div class="quote-text" id="q-text">"마음의 속도를 줄이고, 지금 이 순간 스쳐 지나가는 바람과 불꽃의 온기에 집중해보세요."</div>
        <button class="refresh-btn" onclick="getRandomQuote()">🔄 다른 문장 보기</button>
    </div>

    <!-- Three.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 힐링 명언 데이터베이스 ---
        const quotesData = [
            { category: "🌱 마음 조언", text: "모든 일에는 저마다의 계절이 있습니다. 지금 당신에게는 잠시 쉬어가는 겨울이나 꽃을 피울 준비를 하는 봄이 찾아온 것뿐이에요." },
            { category: "💡 깊은 생각", text: "과거의 후회와 미래의 불안이라는 무거운 짐을 내려놓으세요. 당신에게 진정으로 중요한 시간은 오직 숨쉬고 있는 이 현재뿐입니다." },
            { category: "✨ 오늘의 위로", text: "오늘 하루도 수많은 감정을 견뎌내느라 정말 고생 많았습니다. 거창한 성취가 없어도, 살아 숨 쉰다는 것만으로도 충분히 아름다운 하루예요." },
            { category: "🌊 삶의 지혜", text: "파도가 밀려왔다 밀려나가듯, 우리 삶의 슬픔과 걱정 역시 머물지 않고 흘러갑니다. 곧 평온한 바다가 찾아올 거예요." },
            { category: "🔥 내면의 온기", text: "가장 어두운 밤일수록 작은 모닥불 하나의 온기가 더욱 따뜻하게 느껴지는법입니다. 당신 안의 작은 열정을 믿어보세요." },
            { category: "🍃 휴식의 가치", text: "열심히 달려왔다면 때로는 멈춰 서서 나뭇잎사귀가 흔들리는 소리를 듣는 것, 그것이 가장 현명한 전진일 수 있습니다." },
            { category: "⭐ 희망의 메시지", text: "별은 어둠이 깊을수록 더욱 빛납니다. 지금 겪고 있는 시련은 당신이 더 찬란하게 빛나기 위한 준비 과정일지도 몰라요." }
        ];

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotesData.length);
            const item = quotesData[randomIndex];
            document.getElementById('q-category').innerText = item.category;
            document.getElementById('q-text').innerText = `"${item.text}"`;
        }

        // --- 2. 3D 씬 및 환경 구성 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainSunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        mainSunLight.position.set(10, 20, 10);
        scene.add(mainSunLight);

        const fireLight = new THREE.PointLight(0xffaa33, 2.5, 12);
        fireLight.position.set(0, 0.8, 0);
        scene.add(fireLight);

        const floorGeo = new THREE.PlaneGeometry(90, 90);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a140a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const campfireGroup = new THREE.Group();
        const logMat = new THREE.MeshStandardMaterial({ color: 0x2b1704, roughness: 0.8 });
        for (let i = 0; i < 5; i++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.2, 8), logMat);
            log.rotation.z = Math.PI / 3;
            log.rotation.y = (i * Math.PI) / 2.5;
            log.position.y = 0.1;
            campfireGroup.add(log);
        }
        scene.add(campfireGroup);

        const fireParticleCount = 50;
        const fireGeo = new THREE.BufferGeometry();
        const firePos = new Float32Array(fireParticleCount * 3);
        for (let i = 0; i < fireParticleCount * 3; i += 3) {
            firePos[i] = (Math.random() - 0.5) * 0.4;
            firePos[i+1] = Math.random() * 0.8;
            firePos[i+2] = (Math.random() - 0.5) * 0.4;
        }
        fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
        const fireMat = new THREE.PointsMaterial({ color: 0xff6600, size: 0.15, transparent: true, opacity: 0.8 });
        const fireParticles = new THREE.Points(fireGeo, fireMat);
        scene.add(fireParticles);

        const treeGroup = new THREE.Group();
        scene.add(treeGroup);
        const trees = [];
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x0f401b, roughness: 0.8 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x1a1108 });

        for (let i = 0; i < 45; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 4.5 + Math.random() * 25;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;

            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 3.5, 6), trunkMat);
            trunk.position.set(x, 1.75, z);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.5, 6), leavesMat);
            leaves.position.set(x, 4, z);

            treeGroup.add(trunk);
            treeGroup.add(leaves);
            trees.push({ leaves });
        }

        const particleCount = 220;
        const envGeo = new THREE.BufferGeometry();
        const envPos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            envPos[i] = (Math.random() - 0.5) * 45;
            envPos[i+1] = Math.random() * 10;
            envPos[i+2] = (Math.random() - 0.5) * 45;
        }
        envGeo.setAttribute('position', new THREE.BufferAttribute(envPos, 3));
        const envMat = new THREE.PointsMaterial({ color: 0xaaff88, size: 0.16, transparent: true, opacity: 0.7 });
        const envParticles = new THREE.Points(envGeo, envMat);
        scene.add(envParticles);

        // --- 3. 시간대별 테마 ---
        const timeConfigs = {
            dawn: { fog: 0x1b1c30, bg: 0x1b1c30, ambient: 0x333b55, sunColor: 0xffaa88, sunIntensity: 0.6, leavesColor: 0x1f3a38, particleColor: 0xddaaff },
            morning: { fog: 0x87ceeb, bg: 0x87ceeb, ambient: 0x667788, sunColor: 0xffffff, sunIntensity: 1.2, leavesColor: 0x2e6f40, particleColor: 0xffffff },
            noon: { fog: 0xa0e0ff, bg: 0xa0e0ff, ambient: 0x8899aa, sunColor: 0xffffff, sunIntensity: 1.6, leavesColor: 0x1e8238, particleColor: 0xffffff },
            sunset: { fog: 0x3b1510, bg: 0x3b1510, ambient: 0x663322, sunColor: 0xff6633, sunIntensity: 1.4, leavesColor: 0x4a2511, particleColor: 0xffaa44 },
            night: { fog: 0x050510, bg: 0x050510, ambient: 0x111122, sunColor: 0x4466aa, sunIntensity: 0.4, leavesColor: 0x0b2414, particleColor: 0xaaff88 }
        };

        function setTimeOfDay(timeKey) {
            const cfg = timeConfigs[timeKey];
            scene.fog = new THREE.FogExp2(cfg.fog, 0.02);
            renderer.setClearColor(cfg.bg);
            ambientLight.color.setHex(cfg.ambient);
            mainSunLight.color.setHex(cfg.sunColor);
            mainSunLight.intensity = cfg.sunIntensity;
            leavesMat.color.setHex(cfg.leavesColor);
            envMat.color.setHex(cfg.particleColor);

            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        }

        setTimeOfDay('night');

        // --- 4. 5가지 순수 선택형 3D ASMR 오디오 엔진 ---
        let audioCtx = null;
        let masterGain = null;
        let firePanner, wavePanner, cricketPanner;
        let fireGain, waveGain, rainGain, windGain, cricketGain;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.0;
            masterGain.connect(audioCtx.destination);

            function createNoiseBufferSource(type, freq) {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                src.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = type;
                filter.frequency.value = freq;

                src.connect(filter);
                src.start(0);
                return filter;
            }

            // 1. 모닥불 (기본 0.0)
            firePanner = audioCtx.createPanner();
            firePanner.panningModel = 'HRTF';
            firePanner.setPosition(0, 0, 0);
            
            fireGain = audioCtx.createGain();
            fireGain.gain.value = parseFloat(document.getElementById('vol-fire').value);
            createNoiseBufferSource('bandpass', 450).connect(fireGain);

            function scheduleCrackles() {
                if (!audioCtx) return;
                if (fireGain && fireGain.gain.value > 0.001) {
                    const osc = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1000 + Math.random() * 2500, audioCtx.currentTime);
                    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03 + Math.random() * 0.04);
                    osc.connect(g);
                    g.connect(fireGain);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.06);
                }
                setTimeout(scheduleCrackles, 120 + Math.random() * 350);
            }
            scheduleCrackles();

            fireGain.connect(firePanner);
            firePanner.connect(masterGain);

            // 2. 파도 소리 (기본 0.0)
            wavePanner = audioCtx.createPanner();
            wavePanner.panningModel = 'HRTF';
            wavePanner.setPosition(-15, 0, -15);

            waveGain = audioCtx.createGain();
            waveGain.gain.value = parseFloat(document.getElementById('vol-wave').value);
            createNoiseBufferSource('lowpass', 280).connect(waveGain);
            waveGain.connect(wavePanner);
            wavePanner.connect(masterGain);

            // 3. 비내리는 소리 (기본 0.0)
            rainGain = audioCtx.createGain();
            rainGain.gain.value = parseFloat(document.getElementById('vol-rain').value);
            createNoiseBufferSource('lowpass', 1200).connect(rainGain);
            rainGain.connect(masterGain);

            // 4. 바람 소리 (기본 0.0)
            windGain = audioCtx.createGain();
            windGain.gain.value = parseFloat(document.getElementById('vol-wind').value);
            createNoiseBufferSource('bandpass', 200).connect(windGain);
            windGain.connect(masterGain);

            // 5. 풀벌레 소리 (기본 0.0)
            cricketPanner = audioCtx.createPanner();
            cricketPanner.panningModel = 'HRTF';
            cricketPanner.setPosition(15, 0, -15);

            cricketGain = audioCtx.createGain();
            cricketGain.gain.value = parseFloat(document.getElementById('vol-cricket').value);
            
            setInterval(() => {
                if (!audioCtx || !cricketGain || cricketGain.gain.value < 0.001) return;
                const cOsc = audioCtx.createOscillator();
                const cGain = audioCtx.createGain();
                cOsc.type = 'sawtooth';
                cOsc.frequency.setValueAtTime(4200 + Math.random() * 400, audioCtx.currentTime);
                cGain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                cGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                cOsc.connect(cGain);
                cGain.connect(cricketGain);
                cOsc.start();
                cOsc.stop(audioCtx.currentTime + 0.22);
            }, 400);

            cricketGain.connect(cricketPanner);
            cricketPanner.connect(masterGain);

            isAudioInitialized = true;
        }

        // 슬라이더 조절 시에만 소리 발생
        document.getElementById('vol-fire').addEventListener('input', e => { initAudio(); if(fireGain) fireGain.gain.value = e.target.value; document.getElementById('val-fire').innerText = e.target.value; });
        document.getElementById('vol-wave').addEventListener('input', e => { initAudio(); if(waveGain) waveGain.gain.value = e.target.value; document.getElementById('val-wave').innerText = e.target.value; });
        document.getElementById('vol-rain').addEventListener('input', e => { initAudio(); if(rainGain) rainGain.gain.value = e.target.value; document.getElementById('val-rain').innerText = e.target.value; });
        document.getElementById('vol-wind').addEventListener('input', e => { initAudio(); if(windGain) windGain.gain.value = e.target.value; document.getElementById('val-wind').innerText = e.target.value; });
        document.getElementById('vol-cricket').addEventListener('input', e => { initAudio(); if(cricketGain) cricketGain.gain.value = e.target.value; document.getElementById('val-cricket').innerText = e.target.value; });

        window.addEventListener('click', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        let isMuted = false;
        document.getElementById('audio-toggle').addEventListener('click', (e) => {
            initAudio();
            isMuted = !isMuted;
            masterGain.gain.value = isMuted ? 0 : 1.0;
            e.target.textContent = isMuted ? '🔇' : '🔊';
        });

        // --- 5. 마우스 시점 및 입체 음향 Listener 연동 ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;

        window.addEventListener('mousedown', () => { isDragging = true; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                cameraAngle -= deltaX * 0.004;
                camera.position.x = Math.sin(cameraAngle) * 9;
                camera.position.z = Math.cos(cameraAngle) * 9;
                camera.lookAt(0, 1.2, 0);

                if (audioCtx && audioCtx.listener) {
                    const lx = camera.position.x;
                    const lz = camera.position.z;
                    if (audioCtx.listener.setPosition) {
                        audioCtx.listener.setPosition(lx, 2.5, lz);
                        audioCtx.listener.setOrientation(-lx, -0.2, -lz, 0, 1, 0);
                    }
                }
            }
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        // --- 6. 애니메이션 루프 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            fireLight.intensity = 2.0 + Math.sin(time * 10) * 0.4 + Math.cos(time * 19) * 0.3;

            const fPos = fireGeo.attributes.position.array;
            for (let i = 1; i < fPos.length; i += 3) {
                fPos[i] += 0.008;
                if (fPos[i] > 1.0) fPos[i] = 0;
            }
            fireGeo.attributes.position.needsUpdate = true;

            const ePos = envGeo.attributes.position.array;
            for (let i = 1; i < ePos.length; i += 3) {
                ePos[i] += Math.sin(time + i) * 0.003;
            }
            envGeo.attributes.position.needsUpdate = true;

            trees.forEach((tree, idx) => {
                tree.leaves.rotation.z = Math.sin(time * 1.2 + idx) * 0.02;
            });

            camera.lookAt(0, 1.2, 0);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
