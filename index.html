<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 사계절 힐링 스페이스</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            user-select: none;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* 공통 패널 스타일 */
        .glass-panel {
            background: rgba(18, 20, 32, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        /* 좌측 상단: 테마 선택 패널 */
        .theme-container {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 14px 18px;
            z-index: 10;
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }
        .theme-buttons {
            display: flex;
            gap: 8px;
        }
        .theme-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .theme-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* 우측 상단: 사운드 믹서 패널 */
        .sound-container {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 18px;
            width: 240px;
            z-index: 10;
        }
        .sound-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .audio-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .audio-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .sound-control {
            margin-bottom: 10px;
        }
        .sound-control label {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.85);
        }
        .sound-control input[type=range] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
            outline: none;
        }
        .sound-control input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        /* 하단: 힐링 명언 패널 */
        .quote-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 28px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .quote-text {
            font-size: 15px;
            font-weight: 300;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: -0.2px;
        }
        .refresh-quote-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            cursor: pointer;
            margin-top: 4px;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .refresh-quote-btn:hover {
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 좌측 상단: 사계절 테마 버튼 -->
    <div class="glass-panel theme-container">
        <div class="panel-title">SEASONAL THEME</div>
        <div class="theme-buttons">
            <button class="theme-btn" onclick="setSeason('spring')">🌸 봄</button>
            <button class="theme-btn active" onclick="setSeason('summer')">🌿 여름</button>
            <button class="theme-btn" onclick="setSeason('autumn')">🍁 가을</button>
            <button class="theme-btn" onclick="setSeason('winter')">❄️ 겨울</button>
        </div>
    </div>

    <!-- 우측 상단: 사운드 믹서 -->
    <div class="glass-panel sound-container">
        <div class="sound-header">
            <span class="panel-title" style="margin:0;">HEALING SOUNDS</span>
            <button class="audio-toggle-btn" id="audio-toggle">🔊</button>
        </div>
        <div class="sound-control">
            <label>🔥 모닥불</label>
            <input type="range" id="vol-fire" min="0" max="1" step="0.01" value="0.4">
        </div>
        <div class="sound-control">
            <label>🐦 숲속 새소리</label>
            <input type="range" id="vol-bird" min="0" max="1" step="0.01" value="0.2">
        </div>
        <div class="sound-control">
            <label>🦗 밤 귀뚜라미</label>
            <input type="range" id="vol-cricket" min="0" max="1" step="0.01" value="0.3">
        </div>
        <div class="sound-control">
            <label>🌊 파도 소리</label>
            <input type="range" id="vol-wave" min="0" max="1" step="0.01" value="0.1">
        </div>
        <div class="sound-control">
            <label>🌧️ 빗소리</label>
            <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.1">
        </div>
        <div class="sound-control">
            <label>💨 바람소리</label>
            <input type="range" id="vol-wind" min="0" max="1" step="0.01" value="0.2">
        </div>
    </div>

    <!-- 하단: 계절별 명언 -->
    <div class="glass-panel quote-container">
        <div class="quote-text" id="quote-display">"지친 하루 끝, 조용히 불꽃을 바라보며 마음을 쉬어가세요."</div>
        <button class="refresh-quote-btn" onclick="nextQuote()">다른 문장 보기</button>
    </div>

    <!-- Three.js 엔진 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. 명언 데이터 ---
        const quotes = {
            spring: [
                "새로운 시작은 늘 잔잔하게 찾아옵니다. 당신의 봄날을 응원해요.",
                "꽃이 피어나는 것처럼, 당신의 삶에도 따뜻한 온기가 스며들기를.",
                "피어나는 모든 것들은 저마다의 속도가 있습니다. 조급해하지 마세요."
            ],
            summer: [
                "지친 하루 끝, 조용히 밤바람 소리에 마음을 맡겨보세요.",
                "울창한 숲처럼 단단하고 푸른 당신의 하루를 기억합니다.",
                "반딧불이처럼 조용히 빛나는 당신만의 매력이 있습니다."
            ],
            autumn: [
                "모든 것이 무르익어 가는 계절, 당신의 노력도 결실을 맺을 거예요.",
                "떨어지는 낙엽처럼 마음속 불필요한 걱정들도 내려놓으세요.",
                "노을빛처럼 따뜻하고 차분한 밤이 되기를 빕니다."
            ],
            winter: [
                "차가운 눈송이 뒤에 숨어있는 모닥불처럼, 늘 따뜻함을 간직하세요.",
                "조용히 눈 내리는 소리에 집중하며 혼자만의 온기를 느껴보세요.",
                "겨울이 지나면 언제나 봄은 찾아옵니다."
            ]
        };

        let currentSeason = 'summer';
        let quoteIndex = 0;

        function updateQuote() {
            const list = quotes[currentSeason];
            document.getElementById('quote-display').innerText = `"${list[quoteIndex % list.length]}"`;
        }

        function nextQuote() {
            quoteIndex++;
            updateQuote();
        }

        // --- 2. 3D 그래픽 씬 세팅 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 조명
        const ambientLight = new THREE.AmbientLight(0x222244, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x88aaff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 모닥불 조명 (PointLight)
        const fireLight = new THREE.PointLight(0xffaa33, 2.5, 12);
        fireLight.position.set(0, 0.8, 0);
        scene.add(fireLight);

        // 바닥
        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a140a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- 3D 모닥불 오브젝트 ---
        const campfireGroup = new THREE.Group();
        // 장작 나무들
        const logMat = new THREE.MeshStandardMaterial({ color: 0x2b1704, roughness: 0.8 });
        for (let i = 0; i < 5; i++) {
            const logGeo = new THREE.CylinderGeometry(0.08, 0.1, 1.2, 8);
            const log = new THREE.Mesh(logGeo, logMat);
            log.rotation.z = Math.PI / 3;
            log.rotation.y = (i * Math.PI) / 2.5;
            log.position.y = 0.1;
            campfireGroup.add(log);
        }
        scene.add(campfireGroup);

        // 불꽃 파티클
        const fireParticleCount = 60;
        const fireGeo = new THREE.BufferGeometry();
        const firePos = new Float32Array(fireParticleCount * 3);
        for (let i = 0; i < fireParticleCount * 3; i += 3) {
            firePos[i] = (Math.random() - 0.5) * 0.4;
            firePos[i+1] = Math.random() * 0.8;
            firePos[i+2] = (Math.random() - 0.5) * 0.4;
        }
        fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
        const fireMat = new THREE.PointsMaterial({ color: 0xff6600, size: 0.15, transparent: true, opacity: 0.8 });
        const fireParticles = new THREE.Points(fireGeo, fireMat);
        scene.add(fireParticles);

        // --- 나무 생성 및 계절 관리 ---
        const treeGroup = new THREE.Group();
        scene.add(treeGroup);
        const trees = [];

        function createTrees(leafColor, trunkColor = 0x1a1108) {
            // 기존 나무 제거
            while(treeGroup.children.length > 0){ 
                treeGroup.remove(treeGroup.children[0]); 
            }
            trees.length = 0;

            const trunkMat = new THREE.MeshStandardMaterial({ color: trunkColor });
            const leavesMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.8 });

            for (let i = 0; i < 45; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 4 + Math.random() * 25;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;

                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 3.5, 6), trunkMat);
                trunk.position.set(x, 1.75, z);

                const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.4, 3.5, 6), leavesMat);
                leaves.position.set(x, 4, z);

                treeGroup.add(trunk);
                treeGroup.add(leaves);
                trees.push({ leaves, baseZ: z });
            }
        }

        // --- 계절 파티클 (벚꽃/반딧불이/낙엽/눈) ---
        const envParticleCount = 250;
        const envGeo = new THREE.BufferGeometry();
        const envPos = new Float32Array(envParticleCount * 3);

        for (let i = 0; i < envParticleCount * 3; i += 3) {
            envPos[i] = (Math.random() - 0.5) * 40;
            envPos[i+1] = Math.random() * 12;
            envPos[i+2] = (Math.random() - 0.5) * 40;
        }
        envGeo.setAttribute('position', new THREE.BufferAttribute(envPos, 3));
        const envMat = new THREE.PointsMaterial({ size: 0.2, transparent: true, opacity: 0.8 });
        const envParticles = new THREE.Points(envGeo, envMat);
        scene.add(envParticles);

        // 계절 세팅 함수
        function setSeason(season) {
            currentSeason = season;
            quoteIndex = 0;
            updateQuote();

            // 버튼 UI 업데이트
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            event?.target?.classList.add('active');

            if (season === 'spring') {
                scene.fog = new THREE.FogExp2(0x1a0f1a, 0.02);
                renderer.setClearColor(0x1a0f1a);
                floorMat.color.setHex(0x15101a);
                createTrees(0xffb7c5); // 벚꽃 분홍
                envMat.color.setHex(0xffc0cb);
                envMat.size = 0.2;
            } else if (season === 'summer') {
                scene.fog = new THREE.FogExp2(0x050814, 0.025);
                renderer.setClearColor(0x050814);
                floorMat.color.setHex(0x0a140a);
                createTrees(0x0f401b); // 푸른 여름
                envMat.color.setHex(0xaaff88); // 반딧불이
                envMat.size = 0.15;
            } else if (season === 'autumn') {
                scene.fog = new THREE.FogExp2(0x1a0c05, 0.02);
                renderer.setClearColor(0x1a0c05);
                floorMat.color.setHex(0x1a0f08);
                createTrees(0xd9531e); // 가을 단풍
                envMat.color.setHex(0xff9933);
                envMat.size = 0.22;
            } else if (season === 'winter') {
                scene.fog = new THREE.FogExp2(0x0a101d, 0.025);
                renderer.setClearColor(0x0a101d);
                floorMat.color.setHex(0x101826);
                createTrees(0x2a3d34, 0x11161d); // 설산 상록수
                envMat.color.setHex(0xffffff); // 눈송이
                envMat.size = 0.18;
            }
        }

        // 초기 여름 설정
        setSeason('summer');

        // --- 마우스 카메라 컨트롤 ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0;

        window.addEventListener('mousedown', () => { isDragging = true; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                cameraAngle -= deltaX * 0.004;
                camera.position.x = Math.sin(cameraAngle) * 9;
                camera.position.z = Math.cos(cameraAngle) * 9;
                camera.lookAt(0, 1.2, 0);
            }
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        // --- 3. Web Audio API 사운드 엔진 ---
        let audioCtx = null;
        let masterGain = null;
        let fireGain, birdGain, cricketGain, waveGain, rainGain, windGain;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.6;
            masterGain.connect(audioCtx.destination);

            // 노이즈 노드 생성기
            function createNoiseFilter(type, freq) {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                src.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = type;
                filter.frequency.value = freq;

                src.connect(filter);
                src.start(0);
                return filter;
            }

            // 1. 모닥불 소리
            fireGain = audioCtx.createGain();
            fireGain.gain.value = parseFloat(document.getElementById('vol-fire').value);
            createNoiseFilter('bandpass', 700).connect(fireGain);
            fireGain.connect(masterGain);

            // 2. 새소리 (지저귐 오실레이터)
            birdGain = audioCtx.createGain();
            birdGain.gain.value = parseFloat(document.getElementById('vol-bird').value);
            setInterval(() => {
                if (!audioCtx || birdGain.gain.value < 0.01) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2000 + Math.random() * 1000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(3000 + Math.random() * 500, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(birdGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }, 3000);
            birdGain.connect(masterGain);

            // 3. 귀뚜라미 소리 (고주파 맥동)
            cricketGain = audioCtx.createGain();
            cricketGain.gain.value = parseFloat(document.getElementById('vol-cricket').value);
            const cricketOsc = audioCtx.createOscillator();
            const cricketLfo = audioCtx.createGain();
            cricketOsc.type = 'triangle';
            cricketOsc.frequency.value = 4500;
            cricketOsc.connect(cricketGain);
            cricketOsc.start();
            cricketGain.connect(masterGain);

            // 4. 파도 소리
            waveGain = audioCtx.createGain();
            waveGain.gain.value = parseFloat(document.getElementById('vol-wave').value);
            createNoiseFilter('lowpass', 350).connect(waveGain);
            waveGain.connect(masterGain);

            // 5. 빗소리
            rainGain = audioCtx.createGain();
            rainGain.gain.value = parseFloat(document.getElementById('vol-rain').value);
            createNoiseFilter('lowpass', 1200).connect(rainGain);
            rainGain.connect(masterGain);

            // 6. 바람소리
            windGain = audioCtx.createGain();
            windGain.gain.value = parseFloat(document.getElementById('vol-wind').value);
            createNoiseFilter('bandpass', 250).connect(windGain);
            windGain.connect(masterGain);

            isAudioInitialized = true;
        }

        // 볼륨 이벤트 연결
        document.getElementById('vol-fire').addEventListener('input', e => fireGain && (fireGain.gain.value = e.target.value));
        document.getElementById('vol-bird').addEventListener('input', e => birdGain && (birdGain.gain.value = e.target.value));
        document.getElementById('vol-cricket').addEventListener('input', e => cricketGain && (cricketGain.gain.value = e.target.value));
        document.getElementById('vol-wave').addEventListener('input', e => waveGain && (waveGain.gain.value = e.target.value));
        document.getElementById('vol-rain').addEventListener('input', e => rainGain && (rainGain.gain.value = e.target.value));
        document.getElementById('vol-wind').addEventListener('input', e => windGain && (windGain.gain.value = e.target.value));

        // 클릭 시 오디오 해제
        window.addEventListener('click', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        // 음소거 토글
        let isMuted = false;
        document.getElementById('audio-toggle').addEventListener('click', (e) => {
            initAudio();
            isMuted = !isMuted;
            masterGain.gain.value = isMuted ? 0 : 0.6;
            e.target.textContent = isMuted ? '🔇' : '🔊';
        });

        // --- 4. 메인 루프 애니메이션 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 모닥불 조명 깜빡임 효과
            fireLight.intensity = 2.0 + Math.sin(time * 12) * 0.5 + Math.cos(time * 23) * 0.3;

            // 불꽃 파티클 올라가기
            const fPos = fireGeo.attributes.position.array;
            for (let i = 1; i < fPos.length; i += 3) {
                fPos[i] += 0.01;
                if (fPos[i] > 1.0) fPos[i] = 0;
            }
            fireGeo.attributes.position.needsUpdate = true;

            // 계절 파티클 낙하/유영 효과
            const ePos = envGeo.attributes.position.array;
            for (let i = 0; i < ePos.length; i += 3) {
                if (currentSeason === 'winter' || currentSeason === 'spring' || currentSeason === 'autumn') {
                    ePos[i+1] -= 0.02; // 낙하
                    ePos[i] += Math.sin(time + i) * 0.01;
                    if (ePos[i+1] < 0) ePos[i+1] = 12;
                } else {
                    // 여름 반딧불이 자율 유영
                    ePos[i+1] += Math.sin(time * 1.5 + i) * 0.005;
                }
            }
            envGeo.attributes.position.needsUpdate = true;

            // 나무 살짝 흔들림
            trees.forEach((tree, idx) => {
                tree.leaves.rotation.z = Math.sin(time * 1.2 + idx) * 0.02;
            });

            camera.lookAt(0, 1.2, 0);
            renderer.render(scene, camera);
        }

        animate();

        // 리사이즈 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
